[project]
name = "o-clip-rigger"
version = "0.1.0"
description = "Local image search with OpenCLIP and FAISS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.53.0",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
